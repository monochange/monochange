[package]
name = "monochange_extension_app"
version = "0.1.1"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "monochange browser extension — leptoskit popup, options, and background worker"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
# CSR web surface used by extension pages.
web = [
	"dep:leptoskit",
	"leptoskit/web",
	"dep:leptos",
	"dep:wasm-bindgen",
	"dep:wasm-bindgen-futures",
	"dep:js-sys",
	"dep:web-sys",
]
csr = ["web", "leptos/csr"]
# `leptoskit build --platform extension` turns this on.
extension = ["csr", "leptoskit/extension"]

[dependencies]
js-sys = { version = "0.3", optional = true }
leptos = { workspace = true, optional = true }
leptoskit = { workspace = true, optional = true }
monochange_extension_shared = { workspace = true }
monochange_shared = { path = "../../app/crates/monochange_shared", features = ["client"] }
serde = { workspace = true }
serde_json = { workspace = true }
url = "2"
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
	"Headers",
	"RequestCredentials",
	"RequestInit",
	"Response",
	"Window",
] }

[dev-dependencies]
leptoskit = { workspace = true }
monochange_extension_shared = { workspace = true }
