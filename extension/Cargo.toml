[workspace]
resolver = "2"
members = ["monochange_extension_app", "monochange_extension_shared"]
default-members = ["monochange_extension_shared", "monochange_extension_app"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Unlicense"
publish = false
repository = "https://github.com/monochange/monochange"

[workspace.dependencies]
monochange_extension_shared = { path = "monochange_extension_shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Upstream leptoskit main. Cargo.lock pins the reviewed commit; keep the
# extension workspace separate from `app/` until the shared RPC port lands.
leptoskit = { git = "https://github.com/leptoskit/leptoskit", branch = "main", default-features = false }
leptoskit_build = { git = "https://github.com/leptoskit/leptoskit", branch = "main", default-features = false }
leptoskit_rpc = { git = "https://github.com/leptoskit/leptoskit", branch = "main", default-features = false }
leptos = { version = "0.9.0-rc0", default-features = false }
wasm-bindgen = { version = "=0.2.129" }

[profile.release]
lto = "thin"
codegen-units = 1
