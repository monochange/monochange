[workspace]
resolver = "2"
members = ["monochange_extension_app", "monochange_extension_shared"]
default-members = ["monochange_extension_shared", "monochange_extension_app"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Unlicense"
publish = false
repository = "https://github.com/monochange/monochange"

[workspace.dependencies]
monochange_extension_shared = { path = "monochange_extension_shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# leptoskit 0.3 pins Leptos 0.9-rc0; keep the extension workspace separate from
# the Leptos 0.8 `app/` tree until the web/RPC port lands on the same stack.
leptoskit = { version = "=0.3.0", default-features = false }
leptoskit_build = { version = "=0.3.0", default-features = false }
leptoskit_rpc = { version = "=0.3.0", default-features = false }
leptos = { version = "0.9.0-rc0", default-features = false }
wasm-bindgen = { version = "=0.2.129" }

[profile.release]
lto = "thin"
codegen-units = 1
