[workspace]
resolver = "2"
members = ["monochange_extension_app", "monochange_extension_shared"]
default-members = ["monochange_extension_shared", "monochange_extension_app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Unlicense"
publish = false
repository = "https://github.com/monochange/monochange"

[workspace.dependencies]
monochange_extension_shared = { path = "monochange_extension_shared" }
monochange_shared = { path = "../app/crates/monochange_shared", features = ["client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Upstream leptoskit is pinned to the same immutable revision as the app,
# native workspace, and managed CLI. Upgrade every manifest rev and CLI pin
# together with the three lockfiles. The extension builds independently
# and shares product contracts with `app/`.
leptoskit = { git = "https://github.com/leptoskit/leptoskit", rev = "fa3d29f8e8c837b19f92f1e9a95f699803543767", default-features = false }
leptoskit_build = { git = "https://github.com/leptoskit/leptoskit", rev = "fa3d29f8e8c837b19f92f1e9a95f699803543767", default-features = false }
leptoskit_rpc = { git = "https://github.com/leptoskit/leptoskit", rev = "fa3d29f8e8c837b19f92f1e9a95f699803543767", default-features = false }
leptos = { version = "0.9.0-rc0", default-features = false }
wasm-bindgen = { version = "=0.2.129" }

[profile.release]
lto = "thin"
codegen-units = 1
