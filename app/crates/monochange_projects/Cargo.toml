[package]
name = "monochange_projects"
version = "0.4.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "monochange projects shared product UI and server functions"

[dependencies]
# Leptos (available on both native and WASM)
chrono = { workspace = true }
leptos = { workspace = true, features = ["nightly"] }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
# leptoskit re-exports the server stack and leptoskit_rpc::api.
leptoskit = { workspace = true, optional = true, default-features = false }
leptoskit_rpc = { workspace = true, default-features = false, features = ["client"] }
monochange_app_feedback = { workspace = true, features = ["schema"] }
monochange_shared = { workspace = true, features = ["schema", "client"] }
schemars = { workspace = true }
serde = { workspace = true }
server_fn = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
leptos_axum = { workspace = true }
server_fn = { workspace = true, features = ["axum"] }
axum = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
ammonia = { workspace = true }
pulldown-cmark = { workspace = true }
jsonwebtoken = { workspace = true }
axum-extra = { workspace = true }
time = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
sqlx = { workspace = true }
urlencoding = "2"
monochange_app_db = { workspace = true }
monochange_app_api = { workspace = true }

[features]
default = []
# Server: SSR render + Axum + leptoskit_rpc #[api] registration.
ssr = [
	"dep:leptoskit",
	"leptos/ssr",
	"leptos_meta/ssr",
	"leptos_router/ssr",
	"leptoskit/server",
	"leptoskit/rpc-ssr",
	"leptoskit_rpc/ssr",
]
# Browser: hydrate the shared components this library contributes to the
# website client's bundle (the projects entry enables it through
# monochange_projects_web/hydrate).
hydrate = ["leptos/hydrate", "leptos/lazy", "leptoskit_rpc/web"]

[dev-dependencies]
hmac = "0.12"
httpmock = { workspace = true }
insta = { version = "1", features = ["json", "filters"] }
rsa = { version = "0.9", features = ["sha2"] }
rstest = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }

[lints]
workspace = true
