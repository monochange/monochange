[package]
name = "monochange_shared"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "Wire DTOs shared by the monochange website, future browser extension, and native guests"

[dependencies]
serde = { workspace = true }
# Optional JSON Schema so leptoskit_rpc `#[api]` can publish stable OpenAPI later.
schemars = { workspace = true, optional = true }
# Client session handoff: PKCE helpers and the platform-neutral API client.
async-trait = { workspace = true, optional = true }
base64 = { version = "0.22", optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { version = "0.10", optional = true }
thiserror = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[features]
default = []
# Enable when annotating product RPCs with leptoskit_rpc `#[api]`.
schema = ["dep:schemars"]
# The browser-extension / native client session handoff contract and transport.
client = [
	"dep:async-trait",
	"dep:base64",
	"dep:serde_json",
	"dep:sha2",
	"dep:thiserror",
	"dep:url",
]

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
