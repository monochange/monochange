[package]
name = "monochange_app"
version = "0.4.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "monochange web application — Leptos SSR frontend and server"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "monochange_app"
path = "src/main.rs"
required-features = ["ssr"]

[build-dependencies]
leptoskit_router_codegen = "0.3"

[dependencies]
# Leptos (available on both native and WASM)
chrono = { workspace = true }
leptos = { workspace = true, features = ["nightly"] }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
# leptoskit re-exports the server stack and leptoskit_rpc::api.
leptoskit = { workspace = true, optional = true, default-features = false }
leptoskit_router = { workspace = true, default-features = false }
leptoskit_rpc = { workspace = true, default-features = false, features = ["client"] }
monochange_app_feedback = { workspace = true, features = ["schema"] }
monochange_shared = { workspace = true, features = ["schema"] }
schemars = { workspace = true }
serde = { workspace = true }
server_fn = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
any_spawner = { workspace = true }
leptos_axum = { workspace = true }
server_fn = { workspace = true, features = ["axum"] }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
governor = { workspace = true }
serde_json = { workspace = true }
ammonia = { workspace = true }
pulldown-cmark = { workspace = true }
include_dir = "0.7"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
semver = { workspace = true }
tracing-subscriber = { workspace = true }
jsonwebtoken = { workspace = true }
axum-extra = { workspace = true }
time = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
sqlx = { workspace = true }
urlencoding = "2"
uuid = { workspace = true }
monochange_core = { workspace = true }
monochange_github = { workspace = true }
monochange_hosting = { workspace = true }
monochange_app_db = { workspace = true }
monochange_app_automation = { workspace = true }
monochange_app_api = { workspace = true }
monochange_backend = { workspace = true }

# WASM-only dependencies (compiled only on wasm32 target)
[target.'cfg(target_arch = "wasm32")'.dependencies]
any_spawner = { workspace = true }
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
log = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true }

[package.metadata.leptos]
output-name = "monochange_app"
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "../../public"
style-file = "style/output.css"
site-addr = "127.0.0.1:3000"
reload-port = 3001
# Features enabled for the WASM (client) compilation
lib-features = ["hydrate"]
# Server / bin features for cargo-leptos and leptoskit
bin-features = ["ssr"]
tailwind-input-file = "style/input.css"

[features]
default = []
# Server: SSR render + Axum + leptoskit_rpc #[api] registration.
ssr = [
	"dep:leptoskit",
	"leptos/ssr",
	"leptos_meta/ssr",
	"leptos_router/ssr",
	"leptoskit/server",
	"leptoskit/web",
	"leptoskit/rpc-ssr",
	"leptoskit_rpc/ssr",
]
# Browser: hydrate the leptoskit tree and call product RPCs.
hydrate = [
	"dep:leptoskit",
	"leptos/hydrate",
	"leptoskit/web",
	"leptoskit_router/web",
	"leptoskit_rpc/web",
]

[dev-dependencies]
hmac = "0.12"
httpmock = { workspace = true }
insta = { version = "1", features = ["json", "filters"] }
rsa = { version = "0.9", features = ["sha2"] }
rstest = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }

[lints]
workspace = true
