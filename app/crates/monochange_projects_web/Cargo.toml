[package]
name = "monochange_projects_web"
version = "0.4.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "monochange projects browser entry: product routes and hydration"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# The shared product library: components, server functions, and pages the
# website backend also renders. This entry crate owns only the product route
# tree and the wasm hydration export, so linking it into the website client
# is never needed — and the product routes' wasm-split exports cannot leak
# into the website bundle.
monochange_projects = { path = "../monochange_projects" }
# Leptos (available on both native and WASM)
leptos = { workspace = true, features = ["nightly"] }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
leptoskit_rpc = { workspace = true, default-features = false, features = ["client"] }
monochange_app_feedback = { workspace = true, features = ["schema"] }
monochange_shared = { workspace = true, features = ["schema", "client"] }
server_fn = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { workspace = true }
leptos_axum = { workspace = true }
monochange_app_db = { workspace = true }
monochange_app_api = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
any_spawner = { workspace = true }
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
log = { workspace = true }
wasm-bindgen = { workspace = true }

[features]
default = []
# Server: SSR render of the product route tree (the website backend composes
# this entry's routes into the one shared backend process).
ssr = [
	"leptos/ssr",
	"leptos_meta/ssr",
	"leptos_router/ssr",
	"leptoskit_rpc/ssr",
	"monochange_projects/ssr",
]
# Browser: hydrate + leptoskit_rpc web client.
hydrate = ["leptos/hydrate", "leptos/lazy", "leptoskit_rpc/web", "monochange_projects/hydrate"]

[dev-dependencies]
insta = { version = "1", features = ["json", "filters"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
