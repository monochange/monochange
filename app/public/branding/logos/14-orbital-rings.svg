<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0c8ee7"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="url(#g4)" fill-opacity="0.05" stroke="url(#g4)" stroke-width="3"/>
  <!-- Three concentric orbital rings -->
  <ellipse cx="256" cy="256" rx="180" ry="60" stroke="#7c3aed" stroke-width="3" fill="none" opacity="0.6" transform="rotate(-20 256 256)"/>
  <ellipse cx="256" cy="256" rx="180" ry="60" stroke="#0c8ee7" stroke-width="3" fill="none" opacity="0.6" transform="rotate(40 256 256)"/>
  <ellipse cx="256" cy="256" rx="180" ry="60" stroke="#059669" stroke-width="3" fill="none" opacity="0.6" transform="rotate(100 256 256)"/>
  <!-- Package dots on orbits -->
  <circle cx="256" cy="76" r="14" fill="#7c3aed" transform="rotate(-20 256 256)"/>
  <circle cx="436" cy="256" r="14" fill="#0c8ee7" transform="rotate(-20 256 256)"/>
  <circle cx="256" cy="76" r="14" fill="#0c8ee7" transform="rotate(40 256 256)"/>
  <circle cx="436" cy="256" r="14" fill="#059669" transform="rotate(40 256 256)"/>
  <circle cx="256" cy="76" r="14" fill="#059669" transform="rotate(100 256 256)"/>
  <circle cx="436" cy="256" r="14" fill="#7c3aed" transform="rotate(100 256 256)"/>
  <!-- Center nucleus -->
  <circle cx="256" cy="256" r="20" fill="url(#g4)" opacity="0.2"/>
  <circle cx="256" cy="256" r="10" fill="url(#g4)"/>
</svg>
