<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- White background -->
  <rect x="0" y="0" width="512" height="512" fill="white"/>
  <!-- MC — solid dark, centered -->
  <text x="256" y="300" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="240" letter-spacing="-12" fill="#1a1a2e">MC</text>
  <!-- Solid dark underline -->
  <rect x="140" y="340" width="232" height="10" rx="5" fill="#1a1a2e"/>
  <!-- Tagline — solid gray -->
  <text x="256" y="390" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="28" letter-spacing="8" fill="#6b7280">MONOCHANGE</text>
</svg>
