[project]
name = "monochange_app"
revision = "1.0"
require_reason = "agents"

# Every secret routes through the process environment unless its profile says
# otherwise, so nothing ever falls back to a user-global default provider.
[defaults]
providers = ["env"]

[providers]
env = "env://"
# Ignored local overrides for development, next to this manifest.
dotenv = "dotenv:.env"
# Production reads every 1Password-backed secret from one item, `monochange.dev`
# in the `monochange` vault. A secret's `path` names the item section and the
# secret name is the field label, so startup costs one auth probe and one
# batched item read. The service account token is the bootstrap secret.
op = { uri = "op+token://monochange/monochange.dev", depends_on = [{ secret = "OP_SERVICE_ACCOUNT_TOKEN" }] }

[profiles.default]
DATABASE_URL = { description = "SQLite connection string", required = true }
JWT_SECRET = { description = "JWT signing secret", required = true, type = "password", generate = true }
GITHUB_CLIENT_ID = { description = "GitHub App client ID for user authorization", required = true }
GITHUB_CLIENT_SECRET = { description = "GitHub App client secret for user authorization", required = true, type = "password" }
GITHUB_APP_ID = { description = "GitHub App ID for installations", required = false }
GITHUB_APP_PRIVATE_KEY = { description = "GitHub App private key (PEM)", required = false, type = "password" }
GITHUB_APP_WEBHOOK_SECRET = { description = "GitHub App webhook secret", required = false, type = "password" }
MONOCHANGE_OIDC_AUDIENCE = { description = "Audience required in GitHub Actions OIDC tokens", required = false }
OPENROUTER_API_KEY = { description = "OpenRouter API key for LLM access", required = false, type = "password" }

[profiles.production]
# The container sets DATABASE_URL next to the volume it points at.
DATABASE_URL = { description = "Production SQLite connection string", required = true }
OP_SERVICE_ACCOUNT_TOKEN = { description = "Read-only 1Password service account token, exported by the container entrypoint", required = true, type = "password" }
# Never generate in production: a missing value must stop startup rather than
# mint a new signing secret and try to write it to the read-only item.
JWT_SECRET = { description = "Production JWT signing secret", required = true, type = "password", generate = false, providers = [{ provider = "op", path = ["auth"] }] }
GITHUB_CLIENT_ID = { description = "Production GitHub App client ID for user authorization", required = true, providers = [{ provider = "op", path = ["github"] }] }
GITHUB_CLIENT_SECRET = { description = "Production GitHub App client secret for user authorization", required = true, type = "password", providers = [{ provider = "op", path = ["github"] }] }
GITHUB_APP_ID = { description = "Production GitHub App ID for installations", required = false, providers = [{ provider = "op", path = ["github"] }] }
GITHUB_APP_PRIVATE_KEY = { description = "Production GitHub App private key (PEM)", required = false, type = "password", providers = [{ provider = "op", path = ["github"] }] }
GITHUB_APP_WEBHOOK_SECRET = { description = "GitHub App webhook secret", required = false, type = "password", providers = [{ provider = "op", path = ["github"] }] }
MONOCHANGE_OIDC_AUDIENCE = { description = "Audience required in GitHub Actions OIDC tokens", required = false, providers = [{ provider = "op", path = ["release"] }] }
OPENROUTER_API_KEY = { description = "Production OpenRouter API key for LLM access", required = false, type = "password", providers = [{ provider = "op", path = ["ai"] }] }

# Development reads the ignored `.env` beside this manifest first, then the
# process environment, and falls back to the local defaults below.
[profiles.development.defaults]
providers = ["dotenv", "env"]

[profiles.development]
DATABASE_URL = { default = "sqlite://./monochange_app.sqlite3" }
JWT_SECRET = { default = "dev-secret-change-in-production", generate = false }
GITHUB_CLIENT_ID = { description = "GitHub App client ID for user authorization (dev)", default = "" }
GITHUB_CLIENT_SECRET = { description = "GitHub App client secret for user authorization (dev)", type = "password", default = "" }

[profiles.ci]
DATABASE_URL = { description = "CI SQLite connection string" }
JWT_SECRET = { description = "CI JWT secret", type = "password", generate = true }
GITHUB_CLIENT_ID = { description = "CI GitHub client ID (test app)", default = "" }
GITHUB_CLIENT_SECRET = { description = "CI GitHub client secret (test app)", type = "password", default = "" }
