[project]
name = "monochange_deployment"
revision = "1.0"

[providers]
# Operators resolve deployment credentials through their own signed-in
# 1Password app, never the production service account. They live in the
# `deploy` item of the `monochange` vault, next to the app's `monochange.dev`
# runtime item.
op = "onepassword://kickjump.1password.com@monochange"

[profiles.default]
DIGITALOCEAN_ACCESS_TOKEN = { description = "Scoped DigitalOcean deployment API token", required = true, type = "password", providers = ["op"], ref = { item = "deploy", field = "DIGITALOCEAN_ACCESS_TOKEN" } }
