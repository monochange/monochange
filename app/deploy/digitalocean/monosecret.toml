[project]
name = "monochange_deployment"
revision = "1.0"

[providers]
# Operators resolve deployment credentials through their own signed-in
# 1Password app, never the production service account. They live in the
# `deploy` section of the same `monochange.dev` item in the `monochange` vault
# that holds the app's runtime secrets.
op = "onepassword://kickjump.1password.com@monochange"

[profiles.default]
DIGITALOCEAN_ACCESS_TOKEN = { description = "Scoped DigitalOcean deployment API token", required = true, type = "password", providers = ["op"], ref = { item = "monochange.dev", section = "deploy", field = "DIGITALOCEAN_ACCESS_TOKEN" } }
