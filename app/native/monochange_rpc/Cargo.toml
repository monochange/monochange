[package]
name = "monochange_rpc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Shared monochange RPC types for web and native leptoskit clients."

[features]
default = []
# Server-side leptoskit_rpc operation bodies + registration.
server = [
	"dep:leptoskit",
	"dep:leptoskit_rpc",
	"leptoskit/rpc",
	"leptoskit/server",
	"leptoskit/db-sqlite",
	"leptoskit_rpc/server",
	"leptoskit_rpc/ssr",
	"leptoskit_rpc/sqlite",
]
# Guest / browser client that calls the operations over HTTP.
client = ["dep:leptoskit", "dep:leptoskit_rpc", "leptoskit/rpc", "leptoskit_rpc/client"]

[dependencies]
leptoskit = { workspace = true, optional = true }
leptoskit_rpc = { workspace = true, optional = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
