[package]
name = "monochange_android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "leptoskit_app"
crate-type = ["staticlib"]

[target.'cfg(target_os = "android")'.dependencies]
leptoskit_bridge_ffi = { workspace = true, features = ["app"] }

[dependencies]
leptoskit_plugin_http = { workspace = true }
leptoskit_plugin_secure_store = { workspace = true }

leptoskit_plugin_crypto = { workspace = true }
leptoskit_plugin_web_auth = { workspace = true }

leptoskit_plugin_linking = { workspace = true }
