[package]
name = "monochange_native_backend"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "RPC registration helpers for the monochange native scaffold server."

[dependencies]
leptoskit = { workspace = true, features = ["server", "rpc", "rpc-ssr", "db-sqlite"] }
monochange_rpc = { path = "../monochange_rpc", features = ["server"] }
