[workspace]
resolver = "2"
members = [
	"monochange_native_app",
	"android",
	"ios",
	".",
]
default-members = ["monochange_native_app", "."]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Unlicense"
publish = false
rust-version = "1.91"

[workspace.dependencies]
leptoskit_plugin_linking = { git = "https://github.com/leptoskit/leptoskit", branch = "main", default-features = false }
monochange_shared = { path = "../crates/monochange_shared", features = ["client"] }
leptoskit_plugin_web_auth = { git = "https://github.com/leptoskit/leptoskit", branch = "main", default-features = false }
leptoskit_plugin_crypto = { git = "https://github.com/leptoskit/leptoskit", branch = "main", default-features = false }
leptos = { version = "0.9.0-rc0", default-features = false }
# Upstream leptoskit main. Cargo.lock pins one reviewed commit for every crate;
# update the Git source deliberately when adopting upstream fixes.
leptoskit = { git = "https://github.com/leptoskit/leptoskit", branch = "main", default-features = false }
leptoskit_plugin_http = { git = "https://github.com/leptoskit/leptoskit", branch = "main", default-features = false }
leptoskit_plugin_secure_store = { git = "https://github.com/leptoskit/leptoskit", branch = "main", default-features = false }
leptoskit_bridge_ffi = { git = "https://github.com/leptoskit/leptoskit", branch = "main", default-features = false }
leptoskit_build = { git = "https://github.com/leptoskit/leptoskit", branch = "main", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package]
name = "monochange_native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release.build-override]
strip = "none"
