[workspace]
resolver = "2"
members = [
	"monochange_rpc",
	"monochange_native_app",
	"monochange_native_backend",
	"android",
	"ios",
	".",
]
default-members = ["monochange_rpc", "monochange_native_backend", "."]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Unlicense"
publish = false
rust-version = "1.91"

[workspace.dependencies]
leptos = { version = "0.9.0-rc0", default-features = false }
# Upstream leptoskit main. Cargo.lock pins one reviewed commit for every crate;
# run `cargo update -p leptoskit -p leptoskit_rpc ...` to pick up fixes.
leptoskit = { git = "https://github.com/leptoskit/leptoskit", branch = "main", default-features = false }
leptoskit_rpc = { git = "https://github.com/leptoskit/leptoskit", branch = "main", default-features = false }
leptoskit_plugin_http = { git = "https://github.com/leptoskit/leptoskit", branch = "main", default-features = false }
leptoskit_plugin_secure_store = { git = "https://github.com/leptoskit/leptoskit", branch = "main", default-features = false }
leptoskit_bridge_ffi = { git = "https://github.com/leptoskit/leptoskit", branch = "main", default-features = false }
leptoskit_build = { git = "https://github.com/leptoskit/leptoskit", branch = "main", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
axum = { version = "0.8", features = ["tokio"] }

[package]
name = "monochange_native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "monochange_native"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
leptoskit = { workspace = true, features = ["server", "rpc", "rpc-ssr", "db-sqlite"] }
monochange_native_backend = { path = "monochange_native_backend" }
tokio = { workspace = true }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release.build-override]
strip = "none"
