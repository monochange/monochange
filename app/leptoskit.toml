#:schema https://leptoskit.dev/schemas/leptoskit.v0.schema.json

schema_version = 0

# monochange.dev website: Leptos SSR + hydrate, nested under app/.
# Prefer `leptoskit dev` / `leptoskit build` when the CLI is installed; keep
# `cargo leptos` as a fallback until CI and Docker switch fully.
#
# Sibling surfaces (extension/, app/native/, …) copy the same `[lint]` /
# `[lint.rules]` block into their own leptoskit.toml. See docs/agents/tooling.md.

[app]
name = "monochange_app"
version = "0.3.3"
default_platform = "web"
platforms = ["web"]
render = "ssr"

[serve]
address = "0.0.0.0"
port = 3000

[build]
# UI crate: screens, routes, hydrate entry (cdylib + lib).
client_package = "monochange_app"
features = []
rustflags = []

[bundle]
# One hydrate bundle. File-router screens share the tree, so there is no
# `#[lazy_route]` chunk for wasm-split to emit as an anonymous `_bg.wasm`.
optimize = "size"
split = false
wasm_opt = true
precompress = true

[lint]
# Prefer view! markup over builder trees for human-authored UI.
markup = "view"
# Workspace `lint:clippy` already denies warnings; lint:leptoskit passes
# `--no-clippy` so this flag only matters for a bare `leptoskit lint` run.
clippy = true

[lint.rules]
# Always #[component], always view! XML, PascalCase components.
component_attribute = "deny"
markup_style = "deny"

# Product RPCs: annotate `#[server]` with leptoskit_rpc `#[api]` as the Leptos
# 0.9 upgrade lands. Machine Class B routes stay on Axum via monochange_backend.
[rpc]
title = "monochange"
servers = ["https://monochange.dev"]
exclude = []
include_internal = false
targets = []

# File routes: `src/routes/` is the URL map. `leptoskit plugin:router routes`
# regenerates `src/routes.rs`. Layouts use the 0.3 router stack (navigate /
# back / replace). Stack, Tabs, and Drawer `navigator()` exports are not in
# the published 0.3 runtime; see the upstream note in the PR.
[[plugins]]
name = "router"

[plugins.options]
dir = "crates/monochange_app/src/routes"
output = "crates/monochange_app/src/routes.rs"

[codepush]
enabled = false
