[defaults]
package_type = "cargo"
changelog = "{{ path }}/CHANGELOG.md"

[package.alpha]
path = "crates/alpha"
tag = true
release = true

[package.beta]
path = "crates/beta"
tag = true
release = true

[ecosystems.cargo]
enabled = true

[cli.release]

[[cli.release.inputs]]
name = "format"
type = "choice"
choices = ["text", "json"]
default = "text"

[[cli.release.steps]]
type = "PrepareRelease"
inputs = ["format"]
