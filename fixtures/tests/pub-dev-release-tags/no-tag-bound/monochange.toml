[defaults]
parent_bump = "patch"
changelog = false

[source]
provider = "github"
owner = "example"
repo = "pub-dev-release-tags"

[group.main]
packages = ["web"]
tag = true
release = true
version_format = "primary"

[package.web]
path = "packages/web"
type = "npm"

[package.cli]
path = "crates/cli"
type = "cargo"
tag = true

# Publishes to pub.dev with a token instead of trusted publishing, so no run
# is bound to its tag.
[package.app_dart]
path = "packages/app_dart"
type = "dart"
tag = true

[package.app_dart.publish]
trusted_publishing = false

[ecosystems.npm]
enabled = true

[ecosystems.dart]
enabled = true

[ecosystems.cargo]
enabled = true

[cli.commit-release]

[[cli.commit-release.steps]]
type = "PrepareRelease"

[[cli.commit-release.steps]]
type = "CommitRelease"
update_release_json = true
