[defaults]
parent_bump = "patch"
changelog = false

[source]
provider = "github"
owner = "example"
repo = "pub-dev-release-tags"

# The primary release tag (`v{{ version }}`) carries the npm package.
[group.main]
packages = ["web"]
tag = true
release = true
version_format = "primary"

[package.web]
path = "packages/web"
type = "npm"

# pub.dev trusted publishing only accepts this package from a run on its own
# release tag, `app_dart/v{{ version }}`.
[package.app_dart]
path = "packages/app_dart"
type = "dart"
tag = true

# pub.dev trusts a separate workflow for this package.
[package.app_dart.publish.trusted_publishing]
workflow = "publish-dart.yml"

[ecosystems.npm]
enabled = true

[ecosystems.dart]
enabled = true

[cli.commit-release]

[[cli.commit-release.steps]]
type = "PrepareRelease"

[[cli.commit-release.steps]]
type = "CommitRelease"
update_release_json = true
