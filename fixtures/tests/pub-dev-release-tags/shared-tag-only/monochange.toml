[defaults]
parent_bump = "patch"
changelog = false

[source]
provider = "github"
owner = "example"
repo = "pub-dev-release-tags"

# The release's only tag, `sdk/v{{ version }}`, carries an npm package and a
# trusted pub.dev package. No package owns the primary tag.
[group.sdk]
packages = ["web", "app_dart"]
tag = true

[package.web]
path = "packages/web"
type = "npm"

[package.app_dart]
path = "packages/app_dart"
type = "dart"

[ecosystems.npm]
enabled = true

[ecosystems.dart]
enabled = true

[cli.commit-release]

[[cli.commit-release.steps]]
type = "PrepareRelease"

[[cli.commit-release.steps]]
type = "CommitRelease"
update_release_json = true
