[defaults]
package_type = "cargo"
parent_bump = "patch"
bump_propagation = "inherit"
changelog = false

[package.core]
path = "crates/core"

[package.engine]
path = "crates/engine"

[package.summary]
path = "crates/summary"

[ecosystems.cargo]
enabled = true
roots = ["crates/*"]

[cli.release]
inputs = [{ name = "format", type = "choice", choices = ["markdown", "json"], default = "json" }]

[[cli.release.steps]]
type = "PrepareRelease"
inputs = ["format"]

