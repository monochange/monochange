lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:
  .:
    dependencies:
      '@acme/api': 2.3.1

  packages/consumer:
    dependencies:
      '@acme/api':
        specifier: ^2.3.1
        version: 2.3.1

  packages/linked-consumer:
    dependencies:
      '@acme/api': 'link:../api'

  packages/workspace-consumer:
    dependencies:
      '@acme/api': 'workspace:*'
