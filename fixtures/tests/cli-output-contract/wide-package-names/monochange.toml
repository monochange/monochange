# Fixture for text tables with package ids wider than their character count.
#
# `🚀-launcher` and `docs-日本語` each contain characters that take two
# terminal columns, so the version columns only line up when widths are
# measured in columns instead of characters.
[defaults]
parent_bump = "patch"
package_type = "cargo"
changelog = false

[package.core]
path = "crates/core"

[package."🚀-launcher"]
path = "crates/launcher"

[package."docs-日本語"]
path = "crates/docs"

[ecosystems.cargo]
enabled = true
