[defaults]
parent_bump = "patch"
package_type = "cargo"

[package.core]
path = "crates/core"
tag = true
release = true
floating_tags = ["v{{ major }}", "v{{ major }}.{{ minor }}"]

[package.app]
path = "crates/app"
release = true

[source]
provider = "github"
owner = "ifiokjr"
repo = "monochange"

[ecosystems.cargo]
enabled = true

[[cli.release-pr.steps]]
type = "PrepareRelease"

[[cli.release-pr.steps]]
type = "OpenReleaseRequest"

[prerelease]
enabled = false
channel = "alpha"
numbering = "increment"
base = "planned"
