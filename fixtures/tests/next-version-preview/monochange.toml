# Fixture for the read-only `monochange next` version preview.
#
# `sdk-a` and `sdk-b` share one release group, so the group reports a single
# planned version and both members follow it. `tool` releases separately, so it
# reports its own planned version.
[defaults]
parent_bump = "patch"
package_type = "cargo"
changelog = false

[package.sdk-a]
path = "crates/sdk-a"

[package.sdk-b]
path = "crates/sdk-b"

[package.tool]
path = "crates/tool"

[group.sdk]
packages = ["sdk-a", "sdk-b"]
tag = true
release = true
version_format = "primary"

[ecosystems.cargo]
enabled = true
