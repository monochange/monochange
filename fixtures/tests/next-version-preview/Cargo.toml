[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"

[workspace.dependencies]
preview-sdk-a = { path = "./crates/sdk-a", version = "1.0.0" }
preview-sdk-b = { path = "./crates/sdk-b", version = "1.0.0" }
preview-tool = { path = "./crates/tool", version = "1.0.0" }
