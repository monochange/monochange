[defaults]
package_type = "cargo"
changelog = "{{ path }}/CHANGELOG.md"

[package.core]
path = "crates/core"
tag = true
release = true

[source]
provider = "github"
owner = "acme"
repo = "actions"

[source.releases]
source = "github_generated"
generate_notes = true

[source.pull_requests]
base = "main"
branch_prefix = "monochange/release"
labels = ["release"]
auto_merge = true

[ecosystems.cargo]
enabled = true

[cli.release]
help_text = "Prepare and publish the release pull request through the hosted monochange app."

[[cli.release.inputs]]
name = "format"
type = "choice"
choices = ["text", "json"]
default = "json"

[[cli.release.inputs]]
name = "no_verify"
type = "boolean"
default = true

[[cli.release.steps]]
type = "PrepareRelease"
inputs = { format = "{{ inputs.format }}", release_json = true }

[[cli.release.steps]]
type = "CommitRelease"
inputs = ["no_verify"]
commit_backend = "hosted"

[[cli.release.steps]]
type = "OpenReleaseRequest"
inputs = ["no_verify"]
backend = "hosted"

# Workflows whose hosted steps receive an unsupported `hosted_auth` input.
[cli.commit-invalid-auth]
help_text = "Commit through the hosted app with an unsupported authentication mode."

[[cli.commit-invalid-auth.steps]]
type = "PrepareRelease"

[[cli.commit-invalid-auth.steps]]
type = "CommitRelease"
commit_backend = "hosted"
inputs = { hosted_auth = "password" }

[cli.request-invalid-auth]
help_text = "Open the release request through the hosted app with an unsupported authentication mode."

[[cli.request-invalid-auth.steps]]
type = "PrepareRelease"

[[cli.request-invalid-auth.steps]]
type = "OpenReleaseRequest"
backend = "hosted"
inputs = { hosted_auth = "password" }

# Earlier steps rewrite files monochange does not track; `stage_all` must
# carry them in the hosted commit, as `git add --all` would locally.
[cli.release-stage-all]
help_text = "Commit every workspace change through the hosted app."

[[cli.release-stage-all.steps]]
type = "PrepareRelease"

[[cli.release-stage-all.steps]]
type = "Command"
name = "regenerate files"
shell = true
command = 'printf "# regenerated\n" > Cargo.lock && printf "{}\n" > schema.json && git add schema.json && printf "pub fn updated() {}\n" > crates/core/src/lib.rs && mkdir -p target && printf "ignored\n" > target/build.log'

[[cli.release-stage-all.steps]]
type = "CommitRelease"
commit_backend = "hosted"
inputs = { stage_all = true }
