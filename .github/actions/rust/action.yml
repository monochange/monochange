name: rust
description: Install the toolchain from rust-toolchain.toml and restore the cargo cache

inputs:
  workspaces:
    description: Cargo workspace directories to cache. Defaults to the repository root.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: install rust toolchain
      uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

    - name: cache cargo
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: ${{ inputs.workspaces }}
