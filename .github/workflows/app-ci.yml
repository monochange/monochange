name: "app-ci"

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
      - "leptoskit.workspace.toml"
      - "fixtures/tests/digitalocean-rollout/**"
      - "scripts/npm/tests/digitalocean-rollout.test.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
      - "leptoskit.workspace.toml"
      - "fixtures/tests/digitalocean-rollout/**"
      - "scripts/npm/tests/digitalocean-rollout.test.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  merge_group:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  deployment-transactions:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: install test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: test installed deployment helpers in isolated Linux
        run: |
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --workdir /workspace node:24-bookworm \
            bash fixtures/tests/digitalocean-rollout/run-linux-tests.sh

  check:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    # Full test debuginfo makes monochange_app's test link exceed rust-lld's
    # 32-bit .debug_macro relocations in ring (R_X86_64_32 out of range).
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: app

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install rust toolchain
        uses: $/.github/actions/rust
        with:
          workspaces: app

      - name: add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --lib
        env:
          DATABASE_URL: "sqlite::memory:"
          JWT_SECRET: "ci-test-jwt-secret-key-123"
          GITHUB_CLIENT_ID: "ci-test-client-id"
          GITHUB_CLIENT_SECRET: "ci-test-client-secret"
