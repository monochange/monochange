name: "app-ci"

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/app-ci.yml"
      - "leptoskit.workspace.toml"
      - "fixtures/tests/digitalocean-rollout/**"
      - "scripts/leptoskit-plugin/**"
      - "scripts/check-wasm-externref-table.ts"
      - "scripts/minify-split-loader.ts"
      - "scripts/npm/tests/digitalocean-rollout.test.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/app-ci.yml"
      - "leptoskit.workspace.toml"
      - "fixtures/tests/digitalocean-rollout/**"
      - "scripts/leptoskit-plugin/**"
      - "scripts/check-wasm-externref-table.ts"
      - "scripts/minify-split-loader.ts"
      - "scripts/npm/tests/digitalocean-rollout.test.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  merge_group:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  deployment-transactions:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: install test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: test installed deployment helpers in isolated Linux
        run: |
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --workdir /workspace node:24-bookworm \
            bash fixtures/tests/digitalocean-rollout/run-linux-tests.sh

  check:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    # Full test debuginfo makes monochange_app's test link exceed rust-lld's
    # 32-bit .debug_macro relocations in ring (R_X86_64_32 out of range).
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: app

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install rust toolchain
        uses: $/.github/actions/rust
        with:
          workspaces: app

      - name: add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --lib
        env:
          DATABASE_URL: "sqlite::memory:"
          JWT_SECRET: "ci-test-jwt-secret-key-123"
          GITHUB_CLIENT_ID: "ci-test-client-id"
          GITHUB_CLIENT_SECRET: "ci-test-client-secret"

  # Native linux/amd64 production image smoke check. The automated release
  # PR (monochange/release/release -> main) additionally tags the
  # smoke-tested image with the exact head commit and exports it as a
  # short-retention artifact, so the operator can load that precise image
  # on the amd64 Droplet for an isolated SQLite upgrade. Runs with the
  # workflow's contents:read permission only: no registry publication,
  # deployment, production secrets, or privileged permissions.
  docker:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      RELEASE_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'monochange/release/release' }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release PR smokes the exact head commit, not a synthetic
          # merge, so the exported image is the tree the release records.
          # An empty ref keeps the default checkout for every other event.
          ref: ${{ env.RELEASE_PR == 'true' && github.event.pull_request.head.sha || '' }}

      # Build through a BuildKit builder so layers and cache mounts persist
      # between runs. Main-branch runs seed the caches every pull request
      # reads; a pull request only writes caches scoped to its own ref.
      - name: set up docker buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The cargo registry and the app target directory live in BuildKit
      # cache mounts, which the layer cache does not export. Restore them
      # from the Actions cache and inject them into the builder so a build
      # only recompiles the crates that changed. Keyed on both lockfiles:
      # a dependency bump starts from the previous cache and saves a new one.
      - name: restore cargo cache mounts
        id: cargo-mounts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/buildkit-cache-mounts
          key: app-image-cargo-mounts-${{ hashFiles('Cargo.lock', 'app/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: app-image-cargo-mounts-

      - name: inject cargo cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/buildkit-cache-mounts
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.cargo-mounts.outputs.cache-hit }}

      - name: build deployment image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Build the checked-out tree (the exact release head on release
          # PRs), not the action's default Git context.
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: monochange-app:smoke
          cache-from: type=gha,scope=app-image
          cache-to: type=gha,scope=app-image,mode=max

      # verify-image.sh checks the shipped WASM modules with a dependency-free
      # TypeScript script, which needs Node's type stripping.
      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: verify deployment image
        run: app/deploy/verify-image.sh monochange-app:smoke

      # Only after the smoke check passed, stamp the exact full-SHA tag so
      # `docker load` on the Droplet restores precisely this image.
      - name: tag the smoke-tested image with the release commit
        if: env.RELEASE_PR == 'true'
        env:
          IMAGE_TAG: monochange-app:${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docker tag monochange-app:smoke "$IMAGE_TAG"
          docker image inspect "$IMAGE_TAG" --format 'smoke-tested image: {{.Id}}'

      - name: export smoke-tested image
        if: env.RELEASE_PR == 'true'
        env:
          IMAGE_TAG: monochange-app:${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/monochange-app-amd64.tar.gz"
          docker save "$IMAGE_TAG" | gzip >"$tarball"
          sha256sum "$tarball"
          ls -lh "$tarball"

      - name: upload smoke-tested image artifact
        if: env.RELEASE_PR == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monochange-app-amd64-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/monochange-app-amd64.tar.gz
          retention-days: 3
          if-no-files-found: error
