name: "app-ci"

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/app-ci.yml"
      - ".github/workflows/app.yml"
      - "monochange.toml"
      - "fixtures/tests/website-releases/**"
      - "fixtures/tests/website-book/**"
      - "docs/src/**"
      - "scripts/benchmark-website.ts"
      - "scripts/website-size.ts"
      - "scripts/website-budgets.json"
      - "scripts/website-size-baseline.json"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/app-ci.yml"
      - ".github/workflows/app.yml"
      - "monochange.toml"
      - "fixtures/tests/website-releases/**"
      - "fixtures/tests/website-book/**"
      - "docs/src/**"
      - "scripts/benchmark-website.ts"
      - "scripts/website-size.ts"
      - "scripts/website-budgets.json"
      - "scripts/website-size-baseline.json"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: nightly
          components: clippy, rustfmt

      - name: install cargo-binstall
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-binstall

      - name: install cargo-leptos
        run: cargo binstall cargo-leptos@0.3.6 --no-confirm

      - name: add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace
        env:
          DATABASE_URL: "sqlite::memory:"
          JWT_SECRET: "ci-test-jwt-secret-key-123"
          GITHUB_CLIENT_ID: "ci-test-client-id"
          GITHUB_CLIENT_SECRET: "ci-test-client-secret"

      - name: cargo leptos build
        run: cargo leptos build

  docker:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: build deployment image
        run: docker build --progress=plain -t monochange-app:ci .

      - name: verify deployment image
        run: app/deploy/verify-image.sh monochange-app:ci

  benchmark:
    timeout-minutes: 50
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      MONOCHANGE_ALLOW_BENCHMARK_BUDGET_FAILURES: "false"
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly

      - name: install cargo-binstall
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-binstall

      - name: install cargo-leptos
        run: cargo binstall cargo-leptos@0.3.6 --no-confirm

      - name: add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app

      - name: setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: install node dependencies
        run: pnpm install --frozen-lockfile

      - name: build release site
        working-directory: app
        run: cargo leptos build --release --split

      - name: check website bundle size
        run: |
          pnpm node scripts/website-size.ts check \
            --site-root app/target/site \
            --output /tmp/website-size.md

      - name: run website lighthouse benchmarks
        id: lighthouse
        run: |
          pnpm node scripts/benchmark-website.ts run \
            --site-root app/target/site \
            --server-bin app/target/release/monochange_app \
            --results /tmp/website-results.json \
            --output /tmp/website-benchmark.md

          {
            echo "results<<ENDOFWEBSITEBENCH"
            cat /tmp/website-size.md
            echo ""
            cat /tmp/website-benchmark.md
            echo "ENDOFWEBSITEBENCH"
          } >> "$GITHUB_OUTPUT"

      - name: comment benchmark results on PR
        if: github.event_name == 'pull_request' && steps.lighthouse.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: website-benchmark
          message: |
            ${{ steps.lighthouse.outputs.results }}

      - name: upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-benchmark-results
          path: |
            /tmp/website-results.json
            /tmp/website-benchmark.md
            /tmp/website-size.md
          retention-days: 90
