name: "app-ci"

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/app-ci.yml"
      - ".github/workflows/app.yml"
      - "monochange.toml"
      - "leptoskit.workspace.toml"
      - "fixtures/tests/website-releases/**"
      - "fixtures/tests/website-book/**"
      - "fixtures/tests/app-frontend-scripts/**"
      - "fixtures/tests/website-split-loader-minify/**"
      - "docs/src/**"
      - "scripts/leptoskit-cli.sh"
      - "scripts/leptoskit-plugin/**"
      - "scripts/lint-leptoskit.sh"
      - "scripts/minify-split-loader.ts"
      - "scripts/benchmark-website.ts"
      - "scripts/website-size.ts"
      - "scripts/website-budgets.json"
      - "scripts/website-size-baseline.json"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/app-ci.yml"
      - ".github/workflows/app.yml"
      - "monochange.toml"
      - "leptoskit.workspace.toml"
      - "fixtures/tests/website-releases/**"
      - "fixtures/tests/website-book/**"
      - "fixtures/tests/app-frontend-scripts/**"
      - "fixtures/tests/website-split-loader-minify/**"
      - "docs/src/**"
      - "scripts/leptoskit-cli.sh"
      - "scripts/leptoskit-plugin/**"
      - "scripts/lint-leptoskit.sh"
      - "scripts/minify-split-loader.ts"
      - "scripts/benchmark-website.ts"
      - "scripts/website-size.ts"
      - "scripts/website-budgets.json"
      - "scripts/website-size-baseline.json"
      - "package.json"
      - "pnpm-lock.yaml"
  merge_group:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    # Full test debuginfo makes monochange_app's test link exceed rust-lld's
    # 32-bit .debug_macro relocations in ring (R_X86_64_32 out of range).
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: app

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: nightly
          components: clippy, rustfmt

      - name: add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace
        env:
          DATABASE_URL: "sqlite::memory:"
          JWT_SECRET: "ci-test-jwt-secret-key-123"
          GITHUB_CLIENT_ID: "ci-test-client-id"
          GITHUB_CLIENT_SECRET: "ci-test-client-secret"

      # Build tools for the leptoskit pipeline: the provenance-verified CLI
      # resolved from [workspace.metadata.bin], wasm-opt (binaryen), the
      # Tailwind compiler, and esbuild for the split-loader minifier. The
      # tooling plugin needs all four; `leptoskit doctor` proves it before a
      # build starts.
      - name: install binaryen
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binaryen jq fonttools
          wasm-opt --version

      - name: install tailwindcss
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "$arch" in
            amd64) tw_arch=x64 ;;
            arm64) tw_arch=arm64 ;;
            *) echo "unsupported architecture: $arch" >&2; exit 1 ;;
          esac
          curl -fsSLO "https://github.com/tailwindlabs/tailwindcss/releases/download/v4.2.1/tailwindcss-linux-${tw_arch}"
          chmod +x "tailwindcss-linux-${tw_arch}"
          sudo mv "tailwindcss-linux-${tw_arch}" /usr/local/bin/tailwindcss
          tailwindcss --help >/dev/null

      - name: install esbuild
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "$arch" in
            amd64) esbuild_arch=linux-x64; esbuild_integrity="sha512-4xTZr1FUmSoQW4XIWmit3tzQrUTZM+N3P0XV8xROKYF50XfI7xeO90+1bZvNwxIufQ9hDQVRJH5YhgPVF8A/HQ==" ;;
            arm64) esbuild_arch=linux-arm64; esbuild_integrity="sha512-pW4AC0P3it8c7do9MVM4p51FzHzdM/TZrerurgRcHJ2WTa1VQ1CIq18xncfpBJw4ojkiZZrKW2yIBWBP92j6Ug==" ;;
            *) echo "unsupported architecture: $arch" >&2; exit 1 ;;
          esac
          curl -fsSL "https://registry.npmjs.org/@esbuild/${esbuild_arch}/-/${esbuild_arch}-0.28.2.tgz" -o /tmp/esbuild.tgz
          printf '%s  /tmp/esbuild.tgz\n' \
            "$(printf '%s' "${esbuild_integrity#sha512-}" | base64 -d | od -An -tx1 | tr -d ' \n')" \
            | sha512sum -c -
          tar -xzf /tmp/esbuild.tgz -C /tmp package/bin/esbuild
          sudo mv /tmp/package/bin/esbuild /usr/local/bin/esbuild
          rm -rf /tmp/esbuild.tgz /tmp/package
          esbuild --version

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: resolve the provenance-verified leptoskit CLI
        working-directory: .
        run: |
          set -euo pipefail
          leptoskit_bin="$(scripts/leptoskit-cli.sh)"
          printf 'LEPTOSKIT_BIN=%s\n' "$leptoskit_bin" >> "$GITHUB_ENV"
          printf 'leptoskit resolved: %s\n' "$("$leptoskit_bin" --version)"

      - name: build both web frontends
        working-directory: .
        run: |
          set -euo pipefail
          # The tooling plugin resolves on PATH from the repository scripts
          # directory; the shim locates the TypeScript plugin beside itself.
          # Fresh per-invocation scratch directories keep the SDK's report
          # truthful; publish-web-site.ts promotes one validated tree only
          # after both builds passed their own budget checks.
          export PATH="$PWD/scripts/leptoskit-plugin:$PATH"
          "$LEPTOSKIT_BIN" doctor
          run_root=".monochange/local/web-build/ci-$(date +%Y%m%d-%H%M%S)-$$"
          mkdir -p "$run_root/web" "$run_root/projects-web"
          (cd app && "$LEPTOSKIT_BIN" build --platform web --out "$GITHUB_WORKSPACE/$run_root/web")
          (cd app/projects && "$LEPTOSKIT_BIN" build --platform web --out "$GITHUB_WORKSPACE/$run_root/projects-web")
          node scripts/leptoskit-plugin/publish-web-site.ts \
            --web-root "$GITHUB_WORKSPACE/$run_root" --site-root app/target/site

      - name: the assembled site holds both frontends
        working-directory: .
        run: |
          set -euo pipefail
          test -f app/target/site/pkg/site/monochange_app.js
          test -f app/target/site/pkg/site/monochange_app.css
          test -f app/target/site/pkg/site/__wasm_split_manifest.json
          test -f app/target/site/pkg/projects/monochange_projects_web.js
          test -f app/target/site/pkg/projects/__wasm_split_manifest.json
          test ! -e app/target/site/pkg/projects/monochange_app.css
          test -f app/target/site/fonts/bricolage-800.woff2
          test -f app/target/site/pkg/site/monochange_app.js.br
          test -f app/target/site/pkg/site/monochange_app.js.gz

  app-coverage:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 1
      # Match devenv coverage: drop test debuginfo so llvm-cov can link ring.
      CARGO_PROFILE_TEST_DEBUG: "0"
      COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
      COVERAGE_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly-2026-05-08
          components: llvm-tools-preview

      - name: install coverage tool
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov@0.8.5

      - name: cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app
          key: app-coverage

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: measure app workspace coverage
        working-directory: app
        run: |
          mkdir -p target/coverage
          cargo-llvm-cov llvm-cov --locked --workspace --lcov --output-path target/coverage/lcov.info
        env:
          DATABASE_URL: "sqlite::memory:"
          JWT_SECRET: "ci-test-jwt-secret-key-123"
          GITHUB_CLIENT_ID: "ci-test-client-id"
          GITHUB_CLIENT_SECRET: "ci-test-client-secret"

      - name: require app source coverage and 100% patch coverage
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          import { resolve, sep } from "node:path";
          import { parseChangedLines, parseLcov, verifyPatchCoverage } from "./scripts/check-patch-coverage.ts";

          const repoRoot = process.cwd();
          const base = process.env.COVERAGE_BASE;
          const head = process.env.COVERAGE_HEAD;
          if (!base || !head || execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim() !== head) {
            throw new Error("coverage must measure the requested head revision");
          }
          const diff = (path) => execFileSync("git", ["diff", "--unified=0", "--no-color", "--no-ext-diff", `${base}...${head}`, "--", path], { encoding: "utf8" });
          const lcovText = readFileSync("app/target/coverage/lcov.info", "utf8");
          const coverage = parseLcov(lcovText, repoRoot);
          if (![...coverage].some(([source, lines]) => source.startsWith(`${resolve("app")}${sep}`) && lines.size > 0)) {
            throw new Error("coverage is missing executable app source maps");
          }
          const diffText = diff("app/");
          const oidcSource = resolve("app/crates/monochange_app_api/src/oidc.rs");
          if (parseChangedLines(diffText, repoRoot).has(oidcSource) && !coverage.get(oidcSource)?.size) {
            throw new Error("app coverage is missing the OIDC executable source map");
          }
          const result = verifyPatchCoverage({ lcovText, diffText, repoRoot, target: 100 });
          console.log(result.summary);
          const oidc = verifyPatchCoverage({ lcovText, diffText: diff("app/crates/monochange_app_api/src/oidc.rs"), repoRoot, target: 100 });
          console.log(`OIDC_${oidc.summary}`);
          if (!result.passed || !oidc.passed) process.exitCode = 1;
          NODE

      - name: upload app coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-coverage
          path: app/target/coverage/lcov.info
          retention-days: 7

  docker:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: build deployment image
        run: docker build --progress=plain -t monochange-app:ci .

      - name: verify deployment image
        run: app/deploy/verify-image.sh monochange-app:ci

  benchmark:
    timeout-minutes: 50
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      MONOCHANGE_ALLOW_BENCHMARK_BUDGET_FAILURES: "false"
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly

      - name: add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: install binaryen
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binaryen jq fonttools
          wasm-opt --version

      - name: cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app

      - name: setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: install node dependencies
        run: pnpm install --frozen-lockfile

      - name: install tailwindcss
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "$arch" in
            amd64) tw_arch=x64 ;;
            arm64) tw_arch=arm64 ;;
            *) echo "unsupported architecture: $arch" >&2; exit 1 ;;
          esac
          curl -fsSLO "https://github.com/tailwindlabs/tailwindcss/releases/download/v4.2.1/tailwindcss-linux-${tw_arch}"
          chmod +x "tailwindcss-linux-${tw_arch}"
          sudo mv "tailwindcss-linux-${tw_arch}" /usr/local/bin/tailwindcss
          tailwindcss --help >/dev/null

      - name: record website build tools
        working-directory: app
        run: |
          set -euo pipefail
          {
            rustup show active-toolchain
            rustc -vV
            cargo -vV
            leptoskit_bin="$(../scripts/leptoskit-cli.sh)"
            "$leptoskit_bin" --version
            leptos_path="$(command -v "$leptoskit_bin")"
            printf 'leptoskit path: %s\n' "$leptos_path"
            printf 'leptoskit SHA256: %s\n' "$(sha256sum "$leptos_path" | cut -d ' ' -f 1)"
            tailwindcss --help 2>&1 | head -1
            pnpm --dir .. exec esbuild --version
            wasm-opt --version
            node --print 'JSON.stringify({node: process.versions.node, zlib: process.versions.zlib})'
            pnpm --version
          } | tee /tmp/website-build-provenance.txt

      # Both web frontends build through the provenance-verified leptoskit
      # CLI. The tooling plugin prepares each scratch bundle inside its own
      # build (esbuild resolves from the workspace devDependency), and
      # publish-web-site.ts stages, validates, and promotes one complete site
      # after both builds passed their own bundle reports and budgets, so the
      # pkg/site + pkg/projects namespaces and precompressed twins ship as
      # the exact bytes the size gate measures below.
      - name: build release site
        working-directory: app
        run: |
          set -euo pipefail
          # esbuild resolves from the workspace devDependency; the tooling
          # plugin resolves on PATH from the repository scripts directory.
          export PATH="$GITHUB_WORKSPACE/scripts/leptoskit-plugin:$PATH"
          leptoskit_bin="$(../scripts/leptoskit-cli.sh)"
          run_root="$GITHUB_WORKSPACE/.monochange/local/web-build/ci-$(date +%Y%m%d-%H%M%S)-$$"
          mkdir -p "$run_root/web" "$run_root/projects-web"
          "$leptoskit_bin" build --release --platform web --out "$run_root/web"
          (cd projects && "$leptoskit_bin" build --release --platform web --out "$run_root/projects-web")
          pnpm node "$GITHUB_WORKSPACE/scripts/leptoskit-plugin/publish-web-site.ts" \
            --web-root "$run_root" --site-root "$GITHUB_WORKSPACE/app/target/site"

      - name: check website bundle size
        run: |
          pnpm node scripts/website-size.ts check \
            --site-root app/target/site \
            --output /tmp/website-size.md

      - name: run website lighthouse benchmarks
        id: lighthouse
        run: |
          pnpm node scripts/benchmark-website.ts run \
            --site-root app/target/site \
            --server-bin app/target/release/monochange_app \
            --results /tmp/website-results.json \
            --output /tmp/website-benchmark.md

          {
            echo "results<<ENDOFWEBSITEBENCH"
            cat /tmp/website-size.md
            echo ""
            cat /tmp/website-benchmark.md
            echo "ENDOFWEBSITEBENCH"
          } >> "$GITHUB_OUTPUT"

      - name: comment benchmark results on PR
        if: github.event_name == 'pull_request' && steps.lighthouse.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: website-benchmark
          message: |
            ${{ steps.lighthouse.outputs.results }}

      - name: upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-benchmark-results
          path: |
            /tmp/website-results.json
            /tmp/website-benchmark.md
            /tmp/website-size.md
            /tmp/website-build-provenance.txt
          retention-days: 90

      - name: upload website package
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-package
          path: app/target/site/pkg/
          retention-days: 90
