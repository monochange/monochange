name: change-classification

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      # A retargeted pull request (for example a stacked pull request whose
      # parent merged) must be classified again against its new base.
      - edited

concurrency:
  group: change-classification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    if: ${{ github.event.action != 'edited' || github.event.changes.base }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: classify changes
        id: classify
        uses: monochange/actions/change-classification@6866cbbd35932bdfb496f5b144578c9274d36ca0 # v0.10.0
        with:
          setup-monochange: devenv shell monochange
          # Compare with the branch this pull request targets, not the default
          # branch, so a stacked pull request does not inherit its parent's
          # changes, and classify the exact head commit of this push.
          base: origin/${{ github.event.pull_request.base.ref }}
          head: ${{ github.event.pull_request.head.sha }}
          detection-level: signature
          dependency-propagation: public
          github-token: ${{ secrets.GITHUB_TOKEN }}
