name: change-classification

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: change-classification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: classify changes
        id: classify
        uses: monochange/actions/change-classification@v0.9.3 # v0
        with:
          setup-monochange: devenv shell monochange
          detection-level: signature
          dependency-propagation: public
          github-token: ${{ secrets.GITHUB_TOKEN }}
