name: "oauth regressions"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  oauth-regressions:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          free-runner-space: "true"

      - name: prove original OAuth paths fail the regressions
        run: |
          set -euo pipefail
          export CARGO_BUILD_JOBS=1 RUST_TEST_THREADS=2 TOKIO_WORKER_THREADS=2
          cd "$DEVENV_ROOT"
          head="$(git rev-parse HEAD)"
          output="${{ runner.temp }}/oauth-regressions"
          mkdir -p "$output"
          paths=(
            app/crates/monochange_app/src/rate_limit.rs
            app/crates/monochange_app/src/server_fns/auth.rs
            app/crates/monochange_app/src/__tests__/rate_limit_tests.rs
            app/crates/monochange_app/src/server_fns/__tests__/auth_tests.rs
            app/crates/monochange_app/src/__tests__/app_tests.rs
          )
          restore_fixed() {
            git restore --source="$head" --worktree -- "${paths[@]}"
          }
          trap restore_fixed EXIT

          # Keep current supporting types and tests; replace only the vulnerable paths.
          original=05d0753505a07ef9bf9bb0fef6e4713da1773ddd
          git show "$original:${paths[0]}" > "${paths[0]}"
          git show "$original:${paths[1]}" > "${paths[1]}"
          node --input-type=module - "${paths[@]:2}" <<'JS'
          import { readFileSync, writeFileSync } from "node:fs";
          const selected = /async fn (oauth_pages_spend_the_address_bucket_before_rendering|replayed_state_is_rejected_before_a_second_provider_exchange|concurrent_callbacks_consume_the_state_once|callback_failure_does_not_create_a_session_and_consumes_the_pending_login|fallback_login_aliases_spend_the_bucket_before_generating_state|fallback_callback_aliases_are_limited_before_provider_work)\(/g;
          for (const path of process.argv.slice(2)) {
            const source = readFileSync(path, "utf8");
            writeFileSync(path, source.replace(selected, "async fn security_regression_oauth_$1("));
          }
          JS

          set +e
          cargo test --manifest-path app/Cargo.toml --package monochange_app --lib --locked \
            security_regression_oauth_ -- --test-threads=2 2>&1 | tee "$output/original.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 101
          node --input-type=module - "$output/original.log" <<'JS'
          import { readFileSync } from "node:fs";
          const log = readFileSync(process.argv[2], "utf8");
          if (!/^test result: FAILED\. 0 passed; 14 failed;/m.test(log)) {
            throw new Error("Expected zero passing and fourteen failing regression tests");
          }
          const failures = log.match(/^---- .*security_regression_oauth_.* stdout ----$/gm) ?? [];
          if (failures.length !== 14) {
            throw new Error(`Expected fourteen test failure sections, received ${failures.length}`);
          }
          JS
          restore_fixed
          git diff --exit-code -- "${paths[@]}"
          test "$(git rev-parse HEAD)" = "$head"
        shell: devenv shell -- bash -e {0}

      - name: run fixed app workspace tests
        run: |
          set -euo pipefail
          export CARGO_BUILD_JOBS=1 RUST_TEST_THREADS=2 TOKIO_WORKER_THREADS=2
          cargo test --manifest-path app/Cargo.toml --workspace --locked \
            2>&1 | tee "${{ runner.temp }}/oauth-regressions/fixed.log"
        shell: devenv shell -- bash -e {0}

      - name: check app formatting
        run: cargo fmt --manifest-path app/Cargo.toml --all --check
        shell: devenv shell -- bash -e {0}

      - name: lint app workspace
        run: |
          set -euo pipefail
          export CARGO_BUILD_JOBS=1 RUST_TEST_THREADS=2 TOKIO_WORKER_THREADS=2
          cargo clippy --manifest-path app/Cargo.toml --workspace --all-targets --locked -- -D warnings
        shell: devenv shell -- bash -e {0}

      - name: inspect release-note outputs
        run: |
          set -euo pipefail
          export CARGO_BUILD_JOBS=1 RUST_TEST_THREADS=2 TOKIO_WORKER_THREADS=2
          monochange step validate
          monochange step prepare-release --dry-run --format json \
            > "${{ runner.temp }}/oauth-regressions/release-preview.json"
        shell: devenv shell -- bash -e {0}

      - name: upload original and fixed regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oauth-regression-evidence
          path: |
            ${{ runner.temp }}/oauth-regressions/*.log
            ${{ runner.temp }}/oauth-regressions/release-preview.json
          if-no-files-found: error
          retention-days: 7
