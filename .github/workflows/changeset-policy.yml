name: changeset-policy

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

concurrency:
  group: changeset-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup
        uses: $/.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: read current pull request labels
        id: pull_request_labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          labels="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq 'map(.name) | @json')"
          printf 'labels=%s\n' "$labels" >> "$GITHUB_OUTPUT"

      - name: run changeset policy
        uses: monochange/actions/changeset-policy@6866cbbd35932bdfb496f5b144578c9274d36ca0 # v0.10.0
        with:
          setup-monochange: devenv shell monochange
          from: origin/main
          labels: ${{ join(fromJSON(steps.pull_request_labels.outputs.labels), ',') }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
