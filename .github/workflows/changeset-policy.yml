name: changeset-policy

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

concurrency:
  group: changeset-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          free-runner-space: "true"

      - name: collect changed files
        id: changed
        uses: tj-actions/changed-files@v46

      - name: run changeset policy
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          # The Nix/devenv/cargo/pnpm setup accumulates a large environment that
          # exceeds the Linux kernel argv+env limit (~2MB). Trim the environment
          # before launching any command to avoid “Argument list too long.”
          # Keep only essential variables and PATH entries.
          for var in $(compgen -v); do
            case "$var" in
              HOME|PATH|USER|SHELL|LANG|LC_ALL|TERM|CI|GITHUB_*|DEVSHELL_*|NIX_*|IN_NIX_SHELL|DEVENV_*|CARGO_*|RUSTUP_*|PNPM_*|CHANGED_FILES|PR_LABELS_JSON)
                ;;
              *)
                unset "$var" || true
                ;;
            esac
          done

          # Activate devenv environment
          eval "$(devenv print-dev-env)"

          mapfile -t labels < <(jq -r '.[]' <<<"$PR_LABELS_JSON")
          args=(step:affected-packages --format json --verify)

          for path in $CHANGED_FILES; do
            args+=(--changed-paths "$path")
          done

          for label in "${labels[@]}"; do
            args+=(--label "$label")
          done

          mc "${args[@]}"
        shell: bash
