name: changeset-policy

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

concurrency:
  group: changeset-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2025-11-20

      - name: cache cargo registry
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: build monochange CLI
        run: cargo build --release --package monochange --bin mc

      - name: add mc to PATH
        run: echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: collect changed files
        id: changed
        uses: tj-actions/changed-files@v46

      # Write changed files to a temp file instead of an env var.
      # Large PRs (3000+ files) exceed execve's ~2MB environment limit
      # when all filenames are passed as a single CHANGED_FILES env var.
      - name: write changed files to file
        run: |
          printf '%s\n' ${{ steps.changed.outputs.all_changed_files }} > "$RUNNER_TEMP/changed-files.txt"

      - name: run changeset policy
        env:
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          CHANGED_FILES_PATH: ${{ runner.temp }}/changed-files.txt
        run: |
          set -euo pipefail

          mapfile -t labels < <(jq -r '.[]' <<<"$PR_LABELS_JSON")
          args=(step:affected-packages --format json --verify)

          while IFS= read -r path; do
            args+=(--changed-paths "$path")
          done < "$CHANGED_FILES_PATH"

          for label in "${labels[@]}"; do
            args+=(--label "$label")
          done

          mc "${args[@]}"
        shell: bash
