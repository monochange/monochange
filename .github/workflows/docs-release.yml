name: docs-release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1 # v7
        with:
          persist-credentials: false

      - name: setup rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: install mdbook
        run: cargo install --locked mdbook

      - name: configure pages
        uses: actions/configure-pages@v6.0.0 # v6
        with:
          enablement: true

      - name: build book
        run: mdbook build docs

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v5.0.0 # v5
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1 # v5
