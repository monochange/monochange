name: feedback SDKs

on:
  push:
    branches: [main]
    paths: [
      "packages/monochange__feedback*/**",
      "scripts/build-feedback.ts",
      ".github/workflows/feedback-sdks.yml",
    ]
  pull_request:
    paths: [
      "packages/monochange__feedback*/**",
      "scripts/build-feedback.ts",
      ".github/workflows/feedback-sdks.yml",
    ]
  merge_group:

permissions:
  contents: read

concurrency:
  group: feedback-sdks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.9"
          cache: true
      - name: analyze and test native SDK
        shell: bash -e {0}
        run: |
          set -euo pipefail
          (cd packages/monochange__feedback_flutter && flutter pub get)
          (cd packages/monochange__feedback_flutter/example && flutter pub get)
          dart format --output=none --set-exit-if-changed \
            packages/monochange__feedback_flutter/lib packages/monochange__feedback_flutter/test \
            packages/monochange__feedback_flutter/example/lib packages/monochange__feedback_flutter/example/test
          (cd packages/monochange__feedback_flutter && flutter analyze && flutter test)
          (cd packages/monochange__feedback_flutter/example && flutter analyze && flutter test)
