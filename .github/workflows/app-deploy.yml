name: website release deployment

on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
      tag:
        required: true
        type: string

concurrency:
  group: monochange-website-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'monochange/monochange' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment:
      name: website-production
      url: https://monochange.dev
    permissions:
      contents: write
    steps:
      - name: checkout approved release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: setup release tooling
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: verify website release identity
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: devenv shell -- bash -e {0}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^monochange_app/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          monochange step release-record --from HEAD --format json > "$RUNNER_TEMP/website-record.json"
          jq -e --arg commit "$RELEASE_COMMIT" --arg tag "$RELEASE_TAG" '
            .resolved_commit == $commit and .record_commit == $commit and
            any(.record.release_targets[]; .id == "monochange_app" and .tag_name == $tag and .release == true) and
            any(.record.changelogs[]; .owner_id == "monochange_app" and .output == "website_json" and .stream == "website")
          ' "$RUNNER_TEMP/website-record.json"
          jq -er '.record.changelogs[] | select(.owner_id == "monochange_app" and .output == "website" and .stream == "website") | .rendered' \
            "$RUNNER_TEMP/website-record.json" > "$RUNNER_TEMP/website-release-notes.md"
          version="${RELEASE_TAG#monochange_app/v}"
          test -s "app/public/releases/$version.json"
          jq -e --arg version "$version" '.title == $version and all(.sections[].entries[]; .stream == "website")' "app/public/releases/$version.json"

      - name: build the release image
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: docker build --progress=plain -t "monochange-app:$RELEASE_COMMIT" .

      - name: verify the release image
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: app/deploy/verify-image.sh "monochange-app:$RELEASE_COMMIT" "${RELEASE_TAG#monochange_app/v}"

      - name: transfer and deploy through the restricted key
        env:
          DEPLOY_KEY: ${{ secrets.WEBSITE_DEPLOY_SSH_KEY }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/website-deployment-key"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          unset DEPLOY_KEY
          docker save "monochange-app:$RELEASE_COMMIT" | gzip | \
            ssh -F app/deploy/digitalocean/ssh_config -o IdentityFile=none -i "$key" \
              monochange-production "deploy $RELEASE_COMMIT ${RELEASE_TAG#monochange_app/v}"

      - name: verify public website and publish its release notes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#monochange_app/v}"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-max-time 60 \
            https://monochange.dev/health | jq -e --arg version "$version" '.status == "ok" and .http == "up" and .version == $version'
          curl --fail --silent --show-error https://monochange.dev/changelog -o "$RUNNER_TEMP/changelog.html"
          grep -Fq "v$version" "$RUNNER_TEMP/changelog.html"
          curl --fail --silent --show-error "https://monochange.dev/releases/$version.json" | \
            jq -e --arg version "$version" '.title == $version'
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --notes-file "$RUNNER_TEMP/website-release-notes.md" --draft=false --latest=false
