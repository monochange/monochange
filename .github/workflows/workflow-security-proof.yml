name: "workflow-security-proof"

on:
  pull_request:
    branches: [main]
    paths:
      - "app/crates/monochange_app_api/**"
      - "app/Cargo.lock"
      - ".github/workflows/workflow-security-proof.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-and-fixed:
    if: github.head_ref == 'fix/hosted-workflow-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly

      - name: cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app

      - name: prove original workflow authorization failures
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=2 TOKIO_WORKER_THREADS=2
          production=(crates/monochange_app_api/src/github_app.rs crates/monochange_app_api/src/release_api.rs)
          original=05d0753505a07ef9bf9bb0fef6e4713da1773ddd
          evidence="${{ runner.temp }}/workflow-regressions"
          mkdir -p "$evidence"
          log="$evidence/original.log"
          trap 'git restore -- "${production[@]}"' EXIT
          git rev-parse HEAD > "$evidence/provenance.txt"
          git hash-object "${production[@]}" crates/monochange_app_api/src/__tests__/{github_app,release_api}_tests.rs >> "$evidence/provenance.txt"
          for path in "${production[@]}"; do
            git show "$original:app/$path" > "$path"
          done
          git hash-object "${production[@]}" >> "$evidence/provenance.txt"
          set +e
          cargo test --locked -p monochange_app_api --lib workflow_security_ -- --test-threads=2 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 101
          awk '/^test result: FAILED\. 3 passed; 14 failed; 0 ignored;/ { found = 1 } END { exit !found }' "$log"
          awk '/^thread .*workflow_security_.* panicked at / { count++ } END { exit count != 14 }' "$log"

      - name: test fixed API package
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=2 TOKIO_WORKER_THREADS=2
          cargo test --locked -p monochange_app_api --lib -- --test-threads=2 2>&1 | tee "${{ runner.temp }}/workflow-regressions/fixed.log"

      - name: upload original-control evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-security-original-control
          path: ${{ runner.temp }}/workflow-regressions/
