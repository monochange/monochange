[package]
name = "monochange"
version = { workspace = true }
categories = { workspace = true }
documentation = "https://docs.rs/monochange"
edition = { workspace = true }
include = [
	"src/**/*.rs",
	"src/**/*.yml",
	"src/**/*.toml",
	"src/**/*.template",
	"tests/**/*.rs",
	"benches/**/*.rs",
	"Cargo.toml",
	"readme.md",
]
keywords = ["cli", "changelog", "releases", "versioning", "monorepo"]
license = { workspace = true }
readme = "readme.md"
repository = { workspace = true }
rust-version = { workspace = true }
description = "Manage versions and releases for your multiplatform, multilanguage monorepo"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[features]
default = [
	"cargo",
	"npm",
	"deno",
	"dart",
	"python",
	"go",
	"github",
	"gitlab",
	"gitea",
	"forgejo",
	"mcp",
]
cargo = ["monochange_cargo"]
npm = ["monochange_npm"]
deno = ["monochange_deno"]
dart = ["monochange_dart"]
python = ["monochange_python"]
go = ["monochange_go"]
mcp = ["rmcp"]
github = ["monochange_github", "monochange_core/http"]
gitlab = ["monochange_gitlab", "monochange_core/http"]
gitea = ["monochange_gitea", "monochange_core/http"]
forgejo = ["monochange_forgejo", "monochange_core/http"]

[dependencies]
anstyle = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, default-features = true, features = ["color"] }
glob = { workspace = true }
inquire = { workspace = true, default-features = true, features = ["crossterm"] }
minijinja = { workspace = true }
monochange_analysis = { workspace = true }
monochange_cargo = { workspace = true, optional = true }
monochange_changelog = { workspace = true }
monochange_config = { workspace = true }
monochange_core = { workspace = true }
monochange_dart = { workspace = true, optional = true }
monochange_deno = { workspace = true, optional = true }
monochange_forgejo = { workspace = true, optional = true }
monochange_gitea = { workspace = true, optional = true }
monochange_github = { workspace = true, optional = true }
monochange_gitlab = { workspace = true, optional = true }
monochange_go = { workspace = true, optional = true }
monochange_graph = { workspace = true }
monochange_lint = { workspace = true }
monochange_npm = { workspace = true, optional = true }
monochange_publish = { workspace = true }
monochange_python = { workspace = true, optional = true }
monochange_semver = { workspace = true }
monochange_snapshot = { workspace = true }
monochange_telemetry = { workspace = true }
monochange_test_helpers = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
rmcp = { workspace = true, features = ["server", "transport-io", "macros"], optional = true }
rustls = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
shlex = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
termimad = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process"] }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
typed-builder = { workspace = true }
urlencoding = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, default-features = true }
etest = { workspace = true, default-features = true }
httpmock = { workspace = true, default-features = true }
insta = { workspace = true, default-features = true }
insta-cmd = { workspace = true, default-features = true }
monochange_config = { workspace = true }
portable-pty = { workspace = true, default-features = true }
rstest = { workspace = true, default-features = true }
similar-asserts = { workspace = true, default-features = true }
temp-env = { workspace = true, default-features = true }

[[bench]]
name = "cli_commands"
harness = false

[[bench]]
name = "ecosystem_discovery"
harness = false

[[bench]]
name = "check_validation"
harness = false

[lints]
workspace = true
