[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acme-report"
version = "0.5.2"
description = "Human-readable reports rendered from Acme Insight samples"
requires-python = ">=3.11"
dependencies = ["acme-insight>=0.5.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/acme_report"]
