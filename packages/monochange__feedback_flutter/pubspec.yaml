name: monochange_feedback
description: Native feedback conversations, similar requests, voting, and delivery updates for Flutter apps.
version: 0.1.0
homepage: https://monochange.dev
repository: https://github.com/monochange/monochange/tree/main/packages/monochange__feedback_flutter
environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

# The SDK renders Material icons (see lib/src/sheet.dart), so the Material
# Design icon font declaration is required. The top-level `flutter` section is
# also what monochange uses to detect Flutter packages and publish them with
# `flutter pub publish` instead of `dart pub publish`.
flutter:
  uses-material-design: true
